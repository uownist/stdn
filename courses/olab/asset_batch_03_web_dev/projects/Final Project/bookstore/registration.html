<main>
    <section class="registration ">
        <div class="container vh-100">
            <div class="row shadow mt-5 p-4">
                <div class=" ">
                    <h2 class="text-center text-capitalize mb-3"><u>registration form</u></h2>
                </div>
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-body">
                            <form id="regForm" >
                                <div class="row mb-3">
                                    <label for="fristName" class="col-sm-2 col-form-label">Frist Name <span>*</span></label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" id="fristName">
                                        <span id="fristNameError"></span>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <label for="lastName" class="col-sm-2 col-form-label">last Name<span>*</span></label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" id="lastName">
                                        <span id="lastNameError"></span>
                                    </div>

                                </div>
                                <div class="row mb-3">
                                    <label for="UserName" class="col-sm-2 col-form-label">User Name<span>*</span></label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" id="UserName">
                                        <span id="userNameError"></span>
                                    </div>

                                </div>
                                <div class="row mb-3">
                                    <label for="email" class="col-sm-2 col-form-label">Email<span>*</span></label>
                                    <div class="col-sm-10">
                                        <input type="email" class="form-control" id="email">
                                        <span id="emailErrorText"></span>
                                    </div>

                                </div>
                                <div class="row mb-3">
                                    <label for="password" class="col-sm-2 col-form-label">Password<span>*</span></label>
                                    <div class="col-sm-10">
                                        <input type="password" class="form-control" id="password">
                                        <span id="passwordErrorText"></span>
                                    </div>

                                </div>
                                <div class="row mb-3">
                                    <label for="confirmPassword" class="col-sm-2 col-form-label"> Confirm Password<span>*</span></label>
                                    <div class="col-sm-10">
                                        <input type="password" class="form-control" id="confirmPassword">
                                        <span id="confirmPasswordErrorText"></span>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <label for="dateOfBirth" class="col-sm-2 col-form-label">Date of Birth<span>*</span></label>
                                    <div class="col-sm-10">
                                        <input type="date" class="form-control" id="dateOfBirth">
                                        <span id="dateOfBirthError"></span>
                                    </div>
                                </div>
                                <div>
                                    <label>Gender<span>*</span></label>
                                    <input type="radio" name="gender" class="gender">male
                                    <input type="radio" name="gender" class="gender">Female
                                    <span id="genderErrorText"></span>
                                </div>
                                <div class="row mb-3">
                                    <label for="country" class="col-sm-2 col-form-label">Country<span>*</span></label>
                                    <div class="col-sm-10">
                                        <select class="form-select" id="country">
                                            <option selected></option>
                                            <option value="Bangladesh">Bangladesh</option>
                                            <option value="India">India</option>
                                            <option value="Napal">Napal</option>
                                        </select>
                                        <span id="countryErrorText"></span>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <label for="postalCode" class="col-sm-2 col-form-label">Zip Code<span>*</span></label>
                                    <div class="col-sm-10">
                                        <input type="number" class="form-control" id="postalCode">
                                    </div>
                                </div>
                                <p class="text-center">
                                    <button type="submit" id="regButton" value="submit" class="btn btn-outline-success">Submit</button>
                                </p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
